repos:
  - repo: local
    hooks:
      - id: ruff
        name: Lint with ruff
        entry: uv run --extra dev ruff check
        language: system
        types: [python]
        files: ^src/

      - id: pyright
        name: Type check with pyright
        entry: uv run --extra dev pyright
        language: system
        types: [python]
        files: ^src/

      - id: pytest
        name: Run pytest with coverage
        entry: uv run --extra dev pytest -- tests
        language: system
        pass_filenames: false

      - id: cargo-fmt
        name: Format check with cargo fmt
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: Lint with cargo clippy
        entry: cargo clippy --release -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
