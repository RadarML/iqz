[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iqz-analysis"
version = "0.1.0"
description = "Reproducible measurements behind the iqz codec design."
requires-python = ">=3.12"
dependencies = [
    "iqz",
    "tartanstar",
    "roverd",
    "numpy",
    "pandas",
    "pyyaml",
    "zstandard >= 0.22",
    "matplotlib >= 3.8",
    "font-roboto",
    "tyro >= 0.9.0",
    "lz4",
    "pcodec",
    "imagecodecs",
    "soundfile >= 0.12",
]

[project.scripts]
iqz-analysis = "iqz_analysis._cli:cli_main"

[tool.uv.sources]
iqz = { path = "..", editable = true }
tartanstar = { git = "ssh://git@github.com/RadarML/tartanstar.git" }
roverd = { git = "ssh://git@github.com/RadarML/red-rover.git", subdirectory = "format" }

[tool.ruff]
line-length = 80
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "N", "I", "D", "NPY"]
ignore = ["D102", "D107", "D401", "D413", "N806", "N803", "E402", "F722", "F821", "D213", "D203"]
