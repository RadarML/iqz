# Build wheels (one abi3 wheel per platform) and the sdist, test each wheel,
# and publish: to PyPI when a GitHub release is published, and to TestPyPI
# when run manually. Publishing uses PyPI trusted publishing (no API token).
name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheels (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-24.04, target: x86_64 }
          - { os: linux, runner: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos, runner: macos-15-intel, target: x86_64 }
          - { os: macos, runner: macos-latest, target: aarch64 }
          - { os: windows, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: "2014"

      - uses: astral-sh/setup-uv@v6

      - name: Test wheel
        shell: bash
        run: |
          uv venv --python 3.10 .venv-test
          uv pip install --python .venv-test --no-index --no-deps \
            --find-links dist iqz
          uv pip install --python .venv-test iqz pytest
          uv run --no-project --python .venv-test pytest -q tests

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist

  publish:
    needs: [ wheels, sdist ]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: astral-sh/setup-uv@v6

      - name: Publish to PyPI
        if: github.event_name == 'release'
        run: uv publish --trusted-publishing always dist/*

      - name: Publish to TestPyPI
        if: github.event_name != 'release'
        run: >
          uv publish --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/ dist/*
