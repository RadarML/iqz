[package]
name = "iqz"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
# Files in the source distribution (maturin builds the sdist from this list,
# and adds the Python sources, pyproject.toml, README, and LICENSE).
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/rust/**/*.rs",
    "/tests/**/*.py",
    "/tests/data/*",
]

[lib]
name = "_native"
crate-type = ["cdylib"]
path = "rust/lib.rs"

[dependencies]
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py310"] }
zstd-safe = { version = "7", features = ["std"] }

[profile.release]
codegen-units = 1
lto = "fat"
