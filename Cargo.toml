[package]
name = "iqz"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
path = "rust/lib.rs"

[dependencies]
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py310"] }
zstd-safe = { version = "7", features = ["std"] }

[profile.release]
codegen-units = 1
lto = "fat"
